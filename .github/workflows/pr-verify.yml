name: PR Verification

on:
  pull_request:
    branches:
      - main
      - dev
  push:
    branches:
      - feature/favorites-sync
  workflow_dispatch:

jobs:
  verify-builds-and-tests:
    name: Verify Builds and Tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: Check git diff formatting against base branch
        run: |
          git fetch origin main --depth=1
          git diff --check origin/main...HEAD

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'microsoft'
          cache: 'gradle'

      - name: Configure local build properties
        run: |
          echo "isFullBuild=true" >> ./gradle.properties
          echo "SENTRY_DSN=${{ secrets.SENTRY_DSN }}" > ./local.properties
          echo "SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}" >> ./local.properties
          echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" >> ./local.properties
          echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> ./local.properties

      - name: Run Gradle tests and build Android debug APKs
        run: |
          ./gradlew \
            :loginSync:jvmTest \
            :data:jvmTest \
            :composeApp:compileKotlinJvm \
            :desktopApp:compileKotlinJvm \
            :androidApp:assembleDebug \
            --no-configuration-cache

      - name: Verify Android debug APKs and package ID
        run: |
          UNIVERSAL_APK="androidApp/build/outputs/apk/debug/androidApp-universal-debug.apk"
          ARM64_APK="androidApp/build/outputs/apk/debug/androidApp-arm64-v8a-debug.apk"

          if [ ! -f "$UNIVERSAL_APK" ]; then
            echo "Universal debug APK not found at $UNIVERSAL_APK!"
            exit 1
          fi
          if [ ! -f "$ARM64_APK" ]; then
            echo "ARM64 debug APK not found at $ARM64_APK!"
            exit 1
          fi

          echo "Universal APK size: $(ls -lh "$UNIVERSAL_APK" | awk '{print $5}')"
          echo "ARM64 APK size: $(ls -lh "$ARM64_APK" | awk '{print $5}')"

          AAPT2=$(find /usr/local/lib/android/sdk/build-tools "$ANDROID_HOME/build-tools" -name aapt2 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$AAPT2" ] && [ -x "$AAPT2" ]; then
            PKG_ID=$("$AAPT2" dump badging "$UNIVERSAL_APK" | grep -o "package: name='[^']*'" | head -n 1 | cut -d"'" -f2)
            echo "Extracted package ID from universal APK: $PKG_ID"
            if [ "$PKG_ID" != "com.maxrave.simpmusic.dev" ]; then
              echo "ERROR: Package ID mismatch: expected com.maxrave.simpmusic.dev, got '$PKG_ID'"
              exit 1
            fi
            echo "Verified package ID: $PKG_ID"
          else
            echo "Warning: aapt2 not found, skipping badging dump"
          fi

      - name: Verify the debug APKs are signed with the shared debug key
        run: |
          # A debug build that is signed with another key cannot be put over an older one on the
          # phone (INSTALL_FAILED_UPDATE_INCOMPATIBLE), which forces an uninstall and loses
          # everything the app had stored. The shared key is `keystore/naudio-debug.keystore`.
          chmod +x scripts/verify-debug-signing.sh
          ./scripts/verify-debug-signing.sh \
            "androidApp/build/outputs/apk/debug/androidApp-universal-debug.apk" \
            "androidApp/build/outputs/apk/debug/androidApp-arm64-v8a-debug.apk"

      - name: Upload universal debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: naudio-android-debug-apk
          path: androidApp/build/outputs/apk/debug/androidApp-universal-debug.apk
          if-no-files-found: error

      - name: Upload ARM64 debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: naudio-android-arm64-debug
          path: androidApp/build/outputs/apk/debug/androidApp-arm64-v8a-debug.apk
          if-no-files-found: error

  verify-windows-installer:
    name: Verify Windows Installer Compilation & Packaging (Staged Test Assets)
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Read app version from libs.versions.toml
        id: version
        run: |
          $ver = (Select-String -Path gradle/libs.versions.toml -Pattern '^version-name\s*=\s*"([^"]+)"').Matches.Groups[1].Value
          if (-not $ver) {
            Write-Error "Failed to extract version-name from gradle/libs.versions.toml"
            exit 1
          }
          Write-Host "App version: $ver"
          "version=$ver" >> $env:GITHUB_OUTPUT

      - name: Install Inno Setup
        run: |
          choco install innosetup --version=6.7.1 -y --no-progress
          "C:\Program Files (x86)\Inno Setup 6" >> $env:GITHUB_PATH

      - name: Stage dummy test package assets for compiler and packaging validation
        run: |
          $appVer = "${{ steps.version.outputs.version }}"
          New-Item -ItemType Directory -Path "test-stage" -Force | Out-Null
          # Create self-signed test cert matching CN=Naudio using .NET CertificateRequest
          $rsa = [System.Security.Cryptography.RSA]::Create(2048)
          $req = [System.Security.Cryptography.X509Certificates.CertificateRequest]::new("CN=Naudio", $rsa, [System.Security.Cryptography.HashAlgorithmName]::SHA256, [System.Security.Cryptography.RSASignaturePadding]::Pkcs1)
          $cert = $req.CreateSelfSigned([System.DateTimeOffset]::Now.AddDays(-1), [System.DateTimeOffset]::Now.AddYears(1))
          [System.IO.File]::WriteAllBytes("test-stage/simpmusic.crt", $cert.Export([System.Security.Cryptography.X509Certificates.X509ContentType]::Cert))
          # Create dummy test MSIX file (1024 zero bytes)
          [System.IO.File]::WriteAllBytes("test-stage/simpmusic-$appVer.x64.msix", [byte[]]::new(1024))
          Write-Host "Staged test assets in test-stage/"
          Get-ChildItem test-stage/

      - name: Compile Inno Setup EXE installer (Naudio-Setup-x64.exe)
        run: |
          $appVer = "${{ steps.version.outputs.version }}"
          $sourceDir = (Resolve-Path "test-stage").Path
          New-Item -ItemType Directory -Path "dist" -Force | Out-Null
          $outputDir = (Resolve-Path "dist").Path

          Write-Host "Compiling scripts/windows/naudio-installer.iss..."
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVersion="$appVer" /DSourceDir="$sourceDir" /DOutputDir="$outputDir" "scripts/windows/naudio-installer.iss"
          if ($LASTEXITCODE -ne 0) {
            Write-Error "ISCC failed with exit code $LASTEXITCODE"
            exit 1
          }

          $exe = Get-Item "dist/Naudio-Setup-x64.exe"
          if (-not $exe -or $exe.Length -eq 0) {
            Write-Error "Naudio-Setup-x64.exe is missing or empty!"
            exit 1
          }
          Write-Host "Verified Naudio-Setup-x64.exe existence: $($exe.FullName) ($($exe.Length) bytes)"

      - name: Verify fallback ZIP installer packaging and contents
        run: |
          $appVer = "${{ steps.version.outputs.version }}"
          New-Item -ItemType Directory -Path "installers" -Force | Out-Null
          $zipPath = (Resolve-Path "installers").Path + "\Naudio-Windows-Installer.zip"
          Compress-Archive -Path "scripts/windows/install.bat", "test-stage/simpmusic.crt", "test-stage/simpmusic-$appVer.x64.msix" -DestinationPath $zipPath -Force

          $zipItem = Get-Item $zipPath
          if (-not $zipItem -or $zipItem.Length -eq 0) {
            Write-Error "Naudio-Windows-Installer.zip is missing or empty!"
            exit 1
          }
          Write-Host "Verified Naudio-Windows-Installer.zip existence: $($zipItem.FullName) ($($zipItem.Length) bytes)"

          # Validate zip contents
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead($zipPath)
          $entries = $archive.Entries | ForEach-Object { $_.Name }
          $archive.Dispose()

          Write-Host "ZIP entries: $($entries -join ', ')"
          if (-not ($entries -contains "install.bat")) { Write-Error "install.bat missing from ZIP!"; exit 1 }
          if (-not ($entries -contains "simpmusic.crt")) { Write-Error "simpmusic.crt missing from ZIP!"; exit 1 }
          if (-not ($entries -match 'simpmusic-.*\.msix')) { Write-Error "MSIX missing from ZIP!"; exit 1 }
          Write-Host "ZIP contents validation passed!"
