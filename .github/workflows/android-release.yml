name: Build APK for Release (Full & FOSS) && Desktop app release

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish GitHub Release for tag'
        required: false
        type: boolean
        default: false
  push:
    branches:
      - 'main'
    tags:
      - 'v*'
    paths-ignore:
      - 'README.md'
      - 'fastlane/**'
      - 'assets/**'
      - '.github/**/*.md'
      - '.github/FUNDING.yml'
      - '.github/ISSUE_TEMPLATE/**'

permissions:
  contents: read

jobs:
  build-full-release:
    name: Build full release version
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: 'recursive'

      - name: set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: "microsoft"
          cache: 'gradle'

      - name: Update Sentry Secrets
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          echo 'SENTRY_DSN=${{ secrets.SENTRY_DSN }}' > ./local.properties
          echo "SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}" >> ./local.properties

      - name: Update Last.fm secrets
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
        run: |
          echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" >> ./local.properties
          echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> ./local.properties

      - name: Update environment variables
        env:
          BASE_64_SIGNING_KEY: ${{ secrets.BASE_64_SIGNING_KEY }}
        run:
          echo $BASE_64_SIGNING_KEY | base64 -d > simpmusic.jks

      - name: Update build product flavor
        run: |
          echo "" >> ./gradle.properties
          echo "isFullBuild=true" >> ./gradle.properties

      - name: Build full release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./build_and_sign_apk.sh --release --full

      - name: Stage and verify Naudio release APKs
        run: |
          VERSION=$(grep '^version-name' gradle/libs.versions.toml | head -1 | cut -d'"' -f2)
          cd androidApp/build/outputs/apk/release

          # Create standardized Naudio release names for direct distribution
          cp SimpMusic-full-universal-release.apk "Naudio-${VERSION}.apk"
          cp SimpMusic-full-universal-release.apk "Naudio-${VERSION}-universal.apk"
          cp SimpMusic-full-arm64-v8a-release.apk "Naudio-${VERSION}-arm64-v8a.apk"
          cp SimpMusic-full-armeabi-v7a-release.apk "Naudio-${VERSION}-armeabi-v7a.apk"
          cp SimpMusic-full-x86_64-release.apk "Naudio-${VERSION}-x86_64.apk"

          # Remove original SimpMusic release files from staging directory
          rm -f SimpMusic-full-*.apk

          # Verify every signed APK
          BUILD_TOOLS_PATH="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          EXPECTED_FINGERPRINT="0208a0c5291d07483d23ec92f2c9b5a877d1d49969990e872211c5effc0fb41c"
          for apk in Naudio-*.apk; do
            echo "Verifying $apk signature integrity..."
            "$BUILD_TOOLS_PATH/apksigner" verify --verbose "$apk"

            echo "Verifying $apk signing certificate fingerprint against production identity..."
            "$BUILD_TOOLS_PATH/apksigner" verify --print-certs "$apk" | tr -d ' :' | tr '[:upper:]' '[:lower:]' | grep "$EXPECTED_FINGERPRINT" || {
              echo "ERROR: $apk was not signed with expected Naudio production certificate ($EXPECTED_FINGERPRINT)!"
              exit 1
            }
          done
          ls -lh

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-full-release
          path: androidApp/build/outputs/apk/release/Naudio-*.apk

  # SimpMusic for vivo: androidApp under a package vivo's Origin Island follows (vivoAndroidApp),
  # Full build, arm64-v8a only, signed with the same key so the official-build check accepts it.
  build-vivo-release:
    name: Build vivo release version
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: 'recursive'

      - name: set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: "microsoft"
          cache: 'gradle'

      - name: Update Sentry Secrets
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          echo 'SENTRY_DSN=${{ secrets.SENTRY_DSN }}' > ./local.properties
          echo "SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}" >> ./local.properties

      - name: Update Last.fm secrets
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
        run: |
          echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" >> ./local.properties
          echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> ./local.properties

      - name: Update environment variables
        env:
          BASE_64_SIGNING_KEY: ${{ secrets.BASE_64_SIGNING_KEY }}
        run:
          echo $BASE_64_SIGNING_KEY | base64 -d > simpmusic.jks

      - name: Update build product flavor
        run: |
          echo "" >> ./gradle.properties
          echo "isFullBuild=true" >> ./gradle.properties

      - name: Build vivo release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./build_and_sign_apk.sh --release --full --vivo

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-vivo-release
          path: vivoAndroidApp/build/outputs/apk/release/*.apk

  build-foss-release:
    name: Build foss release version
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: 'recursive'

      - name: set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: "microsoft"
          cache: 'gradle'

      - name: Update environment variables
        env:
          BASE_64_SIGNING_KEY: ${{ secrets.BASE_64_SIGNING_KEY }}
        run:
          echo $BASE_64_SIGNING_KEY | base64 -d > simpmusic.jks

      - name: Update build product flavor
        run: |
          echo "" >> ./gradle.properties
          echo "isFullBuild=false" >> ./gradle.properties

      - name: Build foss release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./build_and_sign_apk.sh --release --foss

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-foss-release
          path: androidApp/build/outputs/apk/release/*.apk

  build-desktop-packages:
    name: Build desktop packages (AppImage + Mac zip + Windows msix)
    runs-on: ubuntu-22.04
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: 'recursive'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: "microsoft"
          cache: 'gradle'

      - name: Install libfuse2
        # Needed by appimagetool when wrapping the Linux app. Nothing else is
        # required here: mpvSetupAll only downloads and untars the prebuilt
        # native slices, so no 7-Zip, patchelf or dwarfs toolchain on the runner.
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2

      - name: Update build product flavor
        run: |
          echo "" >> ./gradle.properties
          echo "isFullBuild=true" >> ./gradle.properties

      - name: Update Sentry Secrets
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN_JVM }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          echo 'SENTRY_DSN=${{ secrets.SENTRY_DSN_JVM }}' > ./local.properties
          echo "SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}" >> ./local.properties

      - name: Update Last.fm secrets
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
        run: |
          echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" >> ./local.properties
          echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> ./local.properties

      - name: Generate aboutLibraries.json
        run: ./gradlew exportLibraryDefinitions

      - name: Cache mpv-natives
        uses: actions/cache@v4
        with:
          path: mpv-natives
          key: mpv-natives-${{ hashFiles('composeApp/build.gradle.kts') }}

      - name: Populate mpv-natives for all OSes
        # Conveyor is invoked by its own action further down, NOT through Gradle,
        # so the dependsOn(":composeApp:mpvSetupAll") wired into the conveyor*
        # tasks never fires on this path — the natives have to be staged here
        # explicitly or the installers ship without libmpv.
        run: ./gradlew :composeApp:mpvSetupAll --no-configuration-cache

      - name: Generate Conveyor config
        # Run writeConveyorConfig BEFORE Conveyor so the parser only reads
        # the static generated.conveyor.conf and never tastes Gradle stdout
        # (which can contain plugin println output and break HOCON parsing).
        run: ./gradlew :desktopApp:writeConveyorConfig --no-configuration-cache

      # Linux first: `make linux-app` emits the unpacked tree under output/
      # that our packageConveyorAppImage task wraps into a portable AppImage.
      # Conveyor 22.0 dropped native AppImage support, hence the wrap.
      - name: Run Conveyor (linux-app)
        uses: hydraulic-software/conveyor/actions/build@v22.0
        with:
          command: -Kapp.machines=linux.amd64.glibc make linux-app
          agree_to_license: 1
          signing_key: ${{ secrets.CONVEYOR_SIGNING_KEY }}

      - name: Wrap Linux app tree → AppImage
        run: ./gradlew :desktopApp:packageConveyorAppImage --no-configuration-cache

      # `make site` builds every machine that has non-empty targets +
      # `.appinstaller`, `.exe` wrapper, and the download.html landing
      # page. Conveyor wipes output/ at the start, so it does NOT clobber
      # the AppImage we already wrapped (that lives under
      # desktopApp/build/appimage/).
      #
      # `-Kapp.machines=...` restricts the site build to Mac + Windows.
      # Linux is excluded because we already produced the AppImage in
      # the previous step. Without this restriction, `make site` re-
      # enters Conveyor's Linux tarball pipeline as an intermediate even
      # when `linux.amd64.targets = []`, and that intermediate fails the
      # build with "Linux Tarball Contents for Intel" before the Mac /
      # Windows artifacts get a chance to run.
      - name: Run Conveyor (make site, Mac + Windows only)
        uses: hydraulic-software/conveyor/actions/build@v22.0
        with:
          command: '-Kapp.machines=[mac.amd64,mac.aarch64,windows.amd64] make site'
          agree_to_license: 1
          signing_key: ${{ secrets.CONVEYOR_SIGNING_KEY }}

      # Conveyor names its outputs after app.fsname (simpmusic) and its
      # architecture vocabulary (aarch64/amd64). Release assets ship under the
      # Naudio name with GitHub's arm64/x64 conventions instead; the rename is
      # cosmetic and applied AFTER packaging so no Conveyor or installer
      # identity changes (bundle name, rdns-name, url-schemes are untouched).
      - name: Rename macOS packages to Naudio naming
        run: |
          set -euo pipefail
          shopt -s nullglob
          declare -A ARCH_MAP=( [aarch64]=arm64 [amd64]=x64 )
          for zip in output/simpmusic-*-mac-*.zip; do
            base="$(basename "$zip")"
            version="$(echo "$base" | sed -nE 's/simpmusic-([0-9.]+)-mac-.*/\1/p')"
            arch="$(echo "$base" | sed -nE 's/.*-mac-([a-z0-9]+)\.zip/\1/p')"
            [[ -n "$version" && -n "$arch" ]] || { echo "::error::Cannot parse version/arch from $base"; exit 1; }
            canon="${ARCH_MAP[$arch]:-$arch}"
            mv "$zip" "output/Naudio-${version}-mac-${canon}.zip"
          done
          # Both architectures must be present or the release would be incomplete.
          ls output/Naudio-*-mac-arm64.zip output/Naudio-*-mac-x64.zip

      # Structural verification of the packaged .app — everything here is
      # checkable without a Mac (ZIP listing, plist text, Mach-O header magic).
      # It does NOT claim functional verification; first-launch/Signature
      # behaviour still needs a real macOS device.
      - name: Verify macOS app bundles
        run: |
          set -euo pipefail
          VERSION=$(grep '^version-name' gradle/libs.versions.toml | head -1 | cut -d'"' -f2)
          for zip_path in output/Naudio-*-mac-*.zip; do
            python3 - "$zip_path" "$VERSION" <<'PYEOF'
          import re, struct, sys, zipfile
          zip_path, expected_version = sys.argv[1], sys.argv[2]
          is_arm64 = "-mac-arm64.zip" in zip_path
          z = zipfile.ZipFile(zip_path)
          names = z.namelist()
          errors = []
          apps = sorted(set(n.split("/")[0] for n in names if n.endswith(".app") or n.endswith(".app/")))
          if len(apps) != 1 or not apps[0].endswith(".app"):
              errors.append(f"expected exactly one .app at zip root, got {apps}")
          else:
              app = apps[0] if apps[0].endswith("/") else apps[0] + "/"
              # No AppleDouble sidecars (each one can be sealed into a code signature
              # and then fold back into xattrs on macOS, producing "damaged" reports).
              sidecars = [n for n in names if n.startswith("._") or "/._" in n]
              if sidecars:
                  errors.append(f"AppleDouble sidecars present: {sidecars[:5]}")
              # No nested duplicate bundles.
              nested = [n for n in names if n.count("/") > 1 and n.endswith(".app/")]
              if nested:
                  errors.append(f"nested .app bundles: {nested[:5]}")
              plist_name = f"{app}Contents/Info.plist"
              if plist_name not in names:
                  errors.append("Info.plist missing")
              else:
                  plist = z.read(plist_name).decode("utf-8", "ignore")
                  def val(key):
                      m = re.search(r"<key>%s</key>\s*<string>([^<]*)</string>" % key, plist)
                      return m.group(1) if m else None
                  checks = {
                      "CFBundleName": "Naudio",
                      "CFBundleIdentifier": "com.maxrave.simpmusic",
                      "LSMinimumSystemVersion": "15.0",
                      "CFBundleShortVersionString": expected_version,
                  }
                  for key, want in checks.items():
                      got = val(key)
                      if got != want:
                          errors.append(f"{key}={got!r}, expected {want!r}")
                  exe = val("CFBundleExecutable")
                  if not exe:
                      errors.append("CFBundleExecutable missing")
                  else:
                      exepath = f"{app}Contents/MacOS/{exe}"
                      if exepath not in names:
                          errors.append(f"executable missing: {exepath}")
                      else:
                          head = z.open(exepath).read(12)
                          if head[:4].hex() not in ("cffaedfe", "feedfacf", "cafebabf", "cafebabe"):
                              errors.append(f"executable is not Mach-O (magic {head[:4].hex()})")
                  libmpv_name = f"{app}Contents/Resources/mpv/libmpv.dylib"
                  if libmpv_name not in names:
                      errors.append("bundled libmpv.dylib missing from Resources/mpv")
                  else:
                      head = z.open(libmpv_name).read(12)
                      if head[:4].hex() == "cffaedfe":
                          cputype = struct.unpack("<I", head[4:8])[0]
                          want = 0x0100000C if is_arm64 else 0x01000007  # x86_64 = 7 | ABI64 flag
                          if cputype != want:
                              errors.append(f"libmpv.dylib cputype {cputype:#x} does not match arch (want {want:#x})")
                      else:
                          errors.append(f"libmpv.dylib is not Mach-O 64 (magic {head[:4].hex()})")
          if errors:
              print(f"::error::{zip_path}: " + "; ".join(errors))
              sys.exit(1)
          print(f"::notice::{zip_path}: bundle structure verified ({len(names)} entries)")
          PYEOF
          done

      - name: Stage AppImage into output/ for upload
        run: cp desktopApp/build/appimage/conveyor/SimpMusic-*.AppImage output/

      - name: Show built artifacts
        run: ls -lh output/

      - name: Upload AppImage to run artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-appimage
          path: output/SimpMusic-*.AppImage

      - name: Upload macOS zips to run artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-mac-zips
          path: output/*-mac-*.zip
          if-no-files-found: error

      # Bundle Windows installer = install.bat + simpmusic.crt + msix.
      # Conveyor's default .exe wrapper + .appinstaller fetch URLs from
      # `site.base-url` (GitHub Releases /latest/download/) which 404 for
      # unreleased builds, so we ship our own scripts/windows/install.bat
      # that trusts the cert and sideloads the msix offline — no network
      # round-trip, double-click works, UAC self-elevates.
      #
      # Only x64 is shipped — windows.aarch64 is dropped because
      # androidx.sqlite-bundled lacks a Windows ARM64 native (see
      # conveyor.conf for full context). ARM Windows users get the x64
      # msix running under Prism emulation, which works correctly.
      - name: Bundle Windows offline installer
        run: |
          set -euo pipefail
          if [ ! -f output/simpmusic.crt ]; then
            echo "::error::output/simpmusic.crt missing — Conveyor signing must have failed"
            exit 1
          fi
          msix=$(ls output/simpmusic-*.x64.msix 2>/dev/null | head -1)
          if [ -z "$msix" ]; then
            echo "::error::No simpmusic-*.x64.msix found in output/"
            exit 1
          fi
          mkdir -p installers/
          stage="$(mktemp -d)"
          cp scripts/windows/install.bat "$stage/"
          cp output/simpmusic.crt        "$stage/"
          cp "$msix"                      "$stage/"
          ( cd "$stage" && zip -q -j \
            "${GITHUB_WORKSPACE}/installers/Naudio-Windows-Installer.zip" \
            install.bat simpmusic.crt "$(basename "$msix")" )
          rm -rf "$stage"
          ls -lh installers/

      - name: Upload Windows offline installer
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          path: installers/Naudio-Windows-Installer.zip

  wrap-mac-dmg:
    name: Wrap macOS .zip → .dmg (installer UX)
    # macos-14 was retired by GitHub on 2026-11-02 (labels macos-14/large/xlarge);
    # afterwards this job never received a runner (check-run annotation:
    # "The configuration 'macos-14-arm64-us-default' is not supported") and was
    # cancelled with zero steps in every run. macos-15 is GitHub's stated
    # same-architecture (arm64) replacement.
    runs-on: macos-15
    timeout-minutes: 40
    needs: build-desktop-packages
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6

      - name: Install create-dmg + ImageMagick
        # create-dmg = sindresorhus brew formula. ImageMagick is used to
        # downscale the 2800x1600 source background to a sharp 1400x800
        # bitmap using a Lanczos filter (matches the DMG window size).
        # Skipping the auto-update keeps the brew step a couple of minutes
        # instead of much longer on the shared macOS runners.
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: brew install create-dmg imagemagick

      - name: Read app version
        id: version
        run: |
          VERSION=$(grep '^version-name' gradle/libs.versions.toml | head -1 | cut -d'"' -f2)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "App version: $VERSION"

      - name: Download Mac .zip artifacts
        uses: actions/download-artifact@v4
        with:
          name: desktop-mac-zips
          path: mac-zips

      - name: Prepare background (Lanczos resize 2800x1600 → 1400x800)
        run: |
          mkdir -p build/dmg
          magick composeApp/icon/dmg-background.png \
            -filter Lanczos -resize 1400x800 \
            build/dmg/dmg-bg-1400x800.png

      - name: Wrap each Mac .zip into a polished .dmg
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          shopt -s nullglob
          zips=(mac-zips/*-mac-*.zip)
          [[ ${#zips[@]} -gt 0 ]] || { echo "::error::No macOS ZIP artifacts found in mac-zips/"; exit 1; }
          # The build job already renamed the zips to Naudio-<v>-mac-<arch>.zip;
          # accept the older simpmusic-* names too so a manual rerun of an older
          # artifact set still works.
          declare -A ARCH_MAP=( [aarch64]=arm64 [amd64]=x64 [arm64]=arm64 [x64]=x64 )
          wrapped=0
          for zip in "${zips[@]}"; do
            arch="$(basename "$zip" | sed -nE 's/.*-mac-([a-z0-9]+)\.zip/\1/p')"
            [[ -n "$arch" ]] || { echo "::error::Cannot infer arch from $(basename "$zip")" >&2; exit 1; }
            arch="${ARCH_MAP[$arch]:-$arch}"
            # Belt and braces on the mac side too: exactly one .app, no sidecars.
            listing="$(unzip -Z1 "$zip")"
            [[ "$(echo "$listing" | grep -c '\.app/$')" -ge 1 ]] || { echo "::error::No .app bundle inside $(basename "$zip")" >&2; exit 1; }
            if echo "$listing" | grep -qE '(^|/)\._'; then
              echo "::error::AppleDouble sidecar inside $(basename "$zip") — packaging must strip them" >&2
              exit 1
            fi
            workdir="$(mktemp -d)"
            unzip -q "$zip" -d "$workdir"
            app="$(find "$workdir" -maxdepth 2 -type d -name '*.app' | head -1)"
            [[ -d "$app" ]] || { echo "::error::No .app inside $(basename "$zip")" >&2; exit 1; }
            out="dist/Naudio-${VERSION}-mac-${arch}.dmg"
            scripts/wrap-mac-dmg.sh \
              "$app" \
              build/dmg/dmg-bg-1400x800.png \
              composeApp/icon/circle_app_icon.icns \
              "$out"
            rm -rf "$workdir"
            wrapped=$((wrapped + 1))
          done
          produced=$(ls dist/Naudio-*.dmg 2>/dev/null | wc -l)
          [[ "$produced" -eq "$wrapped" ]] || { echo "::error::Expected $wrapped DMGs, produced $produced — packaging incomplete" >&2; exit 1; }
          echo "Wrapped $wrapped DMG(s):"
          ls -lh dist/

      - name: Upload Mac .dmg artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-mac-dmg
          path: dist/Naudio-*-mac-*.dmg
          if-no-files-found: error

  publish-github-release:
    name: Publish GitHub Release (Production APKs)
    runs-on: ubuntu-latest
    needs: [build-full-release]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release == true)
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Download Full Release APKs
        uses: actions/download-artifact@v4
        with:
          name: app-full-release
          path: release-apks/

      - name: Set up JDK 21 for verification
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: "microsoft"

      - name: Verify APK Signatures before publishing
        run: |
          set -e
          echo "Verifying downloaded release APK signatures..."
          EXPECTED_FINGERPRINT="0208a0c5291d07483d23ec92f2c9b5a877d1d49969990e872211c5effc0fb41c"
          apk_count=0
          for apk in release-apks/Naudio-*.apk; do
            if [ -f "$apk" ]; then
              apk_count=$((apk_count + 1))
              echo "Checking signature metadata in $apk..."
              jar tf "$apk" | grep -E "META-INF/.*\.(RSA|DSA|EC)" || { echo "ERROR: $apk is missing signing signature block!"; exit 1; }
            fi
          done
          if [ "$apk_count" -eq 0 ]; then
            echo "ERROR: No release APKs found to verify in release-apks/!"
            exit 1
          fi

          # Also verify cryptographic integrity and production certificate fingerprint with apksigner if available on runner
          if [ -n "$ANDROID_HOME" ] && [ -d "$ANDROID_HOME/build-tools" ]; then
            BUILD_TOOLS_PATH="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
            if [ -f "$BUILD_TOOLS_PATH/apksigner" ]; then
              echo "Running cryptographic verification and production fingerprint check using apksigner ($BUILD_TOOLS_PATH)..."
              for apk in release-apks/Naudio-*.apk; do
                if [ -f "$apk" ]; then
                  echo "Verifying signature validity of $apk..."
                  "$BUILD_TOOLS_PATH/apksigner" verify --verbose "$apk"

                  echo "Verifying certificate fingerprint of $apk..."
                  "$BUILD_TOOLS_PATH/apksigner" verify --print-certs "$apk" | tr -d ' :' | tr '[:upper:]' '[:lower:]' | grep "$EXPECTED_FINGERPRINT" || {
                    echo "ERROR: $apk does not match expected production signing certificate ($EXPECTED_FINGERPRINT)!"
                    exit 1
                  }
                fi
              done
            fi
          fi

          echo "All release APK signatures and certificate fingerprints successfully validated."
          ls -lh release-apks/

      - name: Read app version and release tag
        id: version
        run: |
          VERSION=$(grep '^version-name' gradle/libs.versions.toml | head -1 | cut -d'"' -f2)
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="v$VERSION"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Naudio ${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-apks/Naudio-*.apk

  publish-desktop-assets:
    name: Publish Desktop Packages (Release Assets)
    runs-on: ubuntu-latest
    needs: [publish-github-release, build-desktop-packages, wrap-mac-dmg]
    if: |
      always() &&
      needs.publish-github-release.result == 'success' &&
      needs.build-desktop-packages.result == 'success' &&
      (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release == true))
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Read app version and release tag
        id: version
        run: |
          VERSION=$(grep '^version-name' gradle/libs.versions.toml | head -1 | cut -d'"' -f2)
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="v$VERSION"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create desktop assets directory
        run: mkdir -p desktop-assets/

      - name: Download Linux AppImage
        uses: actions/download-artifact@v4
        with:
          name: desktop-appimage
          path: desktop-assets/

      - name: Download macOS ZIPs
        uses: actions/download-artifact@v4
        with:
          name: desktop-mac-zips
          path: desktop-assets/

      - name: Download Windows offline installer
        uses: actions/download-artifact@v4
        with:
          name: desktop-windows
          path: desktop-assets/

      - name: Download macOS DMGs (if available)
        if: needs.wrap-mac-dmg.result == 'success'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: desktop-mac-dmg
          path: desktop-assets/

      - name: Verify macOS release completeness
        id: macos_assets
        run: |
          dmg_count=$(ls desktop-assets/*-mac-*.dmg 2>/dev/null | wc -l)
          zip_count=$(ls desktop-assets/*-mac-*.zip 2>/dev/null | wc -l)
          echo "macOS packages: $zip_count zip(s), $dmg_count dmg(s)"
          if [ "$zip_count" -eq 0 ] && [ "$dmg_count" -eq 0 ]; then
            echo "::error::No macOS packages (ZIP or DMG) were staged — the desktop packaging failed"
            exit 1
          fi
          if [ "$dmg_count" -eq 0 ]; then
            echo "status=dmg-missing" >> "$GITHUB_OUTPUT"
            echo "::error::macOS ZIPs will be published but no DMG was produced — the 'Wrap macOS .zip → .dmg' job failed. The release is incomplete; re-run that job and upload the DMGs."
          fi

      - name: List staged desktop release assets
        run: |
          echo "Staged desktop release assets:"
          ls -lh desktop-assets/

      - name: Attach desktop packages to GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          files: |
            desktop-assets/*

      # Reported AFTER the upload so the available assets still publish, but the
      # run is visibly failed when the DMGs never arrived.
      - name: Flag missing DMG in run result
        if: steps.macos_assets.outputs.status == 'dmg-missing'
        run: |
          echo "::error::The macOS release published without DMGs. Users on macOS 15+ cannot install from a quarantined ZIP (Gatekeeper hard-block). Re-run 'Wrap macOS .zip → .dmg' and attach: Naudio-<version>-mac-<arch>.dmg"
          exit 1
