name: Build APK for Release (Full & FOSS) && Desktop app release

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish GitHub Release for tag'
        required: false
        type: boolean
        default: false
  push:
    branches:
      - 'main'
    tags:
      - 'v*'
    paths-ignore:
      - 'README.md'
      - 'fastlane/**'
      - 'assets/**'
      - '.github/**/*.md'
      - '.github/FUNDING.yml'
      - '.github/ISSUE_TEMPLATE/**'

permissions:
  contents: read

jobs:
  build-full-release:
    name: Build full release version
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: 'recursive'

      - name: set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: "microsoft"
          cache: 'gradle'

      - name: Update Sentry Secrets
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          echo 'SENTRY_DSN=${{ secrets.SENTRY_DSN }}' > ./local.properties
          echo "SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}" >> ./local.properties

      - name: Update Last.fm secrets
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
        run: |
          echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" >> ./local.properties
          echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> ./local.properties

      - name: Update environment variables
        env:
          BASE_64_SIGNING_KEY: ${{ secrets.BASE_64_SIGNING_KEY }}
        run:
          echo $BASE_64_SIGNING_KEY | base64 -d > simpmusic.jks

      - name: Update build product flavor
        run: |
          echo "" >> ./gradle.properties
          echo "isFullBuild=true" >> ./gradle.properties

      - name: Build full release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./build_and_sign_apk.sh --release --full

      - name: Stage and verify Naudio release APKs
        run: |
          VERSION=$(grep '^version-name' gradle/libs.versions.toml | head -1 | cut -d'"' -f2)
          cd androidApp/build/outputs/apk/release

          # Create standardized Naudio release names for direct distribution
          cp SimpMusic-full-universal-release.apk "Naudio-${VERSION}.apk"
          cp SimpMusic-full-universal-release.apk "Naudio-${VERSION}-universal.apk"
          cp SimpMusic-full-arm64-v8a-release.apk "Naudio-${VERSION}-arm64-v8a.apk"
          cp SimpMusic-full-armeabi-v7a-release.apk "Naudio-${VERSION}-armeabi-v7a.apk"
          cp SimpMusic-full-x86_64-release.apk "Naudio-${VERSION}-x86_64.apk"

          # Remove original SimpMusic release files from staging directory
          rm -f SimpMusic-full-*.apk

          # Verify every signed APK
          BUILD_TOOLS_PATH="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          for apk in Naudio-*.apk; do
            echo "Verifying $apk..."
            "$BUILD_TOOLS_PATH/apksigner" verify --verbose "$apk"
          done
          ls -lh

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-full-release
          path: androidApp/build/outputs/apk/release/Naudio-*.apk

  # SimpMusic for vivo: androidApp under a package vivo's Origin Island follows (vivoAndroidApp),
  # Full build, arm64-v8a only, signed with the same key so the official-build check accepts it.
  build-vivo-release:
    name: Build vivo release version
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: 'recursive'

      - name: set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: "microsoft"
          cache: 'gradle'

      - name: Update Sentry Secrets
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          echo 'SENTRY_DSN=${{ secrets.SENTRY_DSN }}' > ./local.properties
          echo "SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}" >> ./local.properties

      - name: Update Last.fm secrets
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
        run: |
          echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" >> ./local.properties
          echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> ./local.properties

      - name: Update environment variables
        env:
          BASE_64_SIGNING_KEY: ${{ secrets.BASE_64_SIGNING_KEY }}
        run:
          echo $BASE_64_SIGNING_KEY | base64 -d > simpmusic.jks

      - name: Update build product flavor
        run: |
          echo "" >> ./gradle.properties
          echo "isFullBuild=true" >> ./gradle.properties

      - name: Build vivo release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./build_and_sign_apk.sh --release --full --vivo

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-vivo-release
          path: vivoAndroidApp/build/outputs/apk/release/*.apk

  build-foss-release:
    name: Build foss release version
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: 'recursive'

      - name: set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: "microsoft"
          cache: 'gradle'

      - name: Update environment variables
        env:
          BASE_64_SIGNING_KEY: ${{ secrets.BASE_64_SIGNING_KEY }}
        run:
          echo $BASE_64_SIGNING_KEY | base64 -d > simpmusic.jks

      - name: Update build product flavor
        run: |
          echo "" >> ./gradle.properties
          echo "isFullBuild=false" >> ./gradle.properties

      - name: Build foss release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./build_and_sign_apk.sh --release --foss

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-foss-release
          path: androidApp/build/outputs/apk/release/*.apk

  build-desktop-packages:
    name: Build desktop packages (AppImage + Mac zip + Windows msix)
    runs-on: ubuntu-22.04
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: 'recursive'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: "microsoft"
          cache: 'gradle'

      - name: Install libfuse2
        # Needed by appimagetool when wrapping the Linux app. Nothing else is
        # required here: mpvSetupAll only downloads and untars the prebuilt
        # native slices, so no 7-Zip, patchelf or dwarfs toolchain on the runner.
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2

      - name: Update build product flavor
        run: |
          echo "" >> ./gradle.properties
          echo "isFullBuild=true" >> ./gradle.properties

      - name: Update Sentry Secrets
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN_JVM }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          echo 'SENTRY_DSN=${{ secrets.SENTRY_DSN_JVM }}' > ./local.properties
          echo "SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}" >> ./local.properties

      - name: Update Last.fm secrets
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
        run: |
          echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" >> ./local.properties
          echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> ./local.properties

      - name: Generate aboutLibraries.json
        run: ./gradlew exportLibraryDefinitions

      - name: Cache mpv-natives
        uses: actions/cache@v4
        with:
          path: mpv-natives
          key: mpv-natives-${{ hashFiles('composeApp/build.gradle.kts') }}

      - name: Populate mpv-natives for all OSes
        # Conveyor is invoked by its own action further down, NOT through Gradle,
        # so the dependsOn(":composeApp:mpvSetupAll") wired into the conveyor*
        # tasks never fires on this path — the natives have to be staged here
        # explicitly or the installers ship without libmpv.
        run: ./gradlew :composeApp:mpvSetupAll --no-configuration-cache

      - name: Generate Conveyor config
        # Run writeConveyorConfig BEFORE Conveyor so the parser only reads
        # the static generated.conveyor.conf and never tastes Gradle stdout
        # (which can contain plugin println output and break HOCON parsing).
        run: ./gradlew :desktopApp:writeConveyorConfig --no-configuration-cache

      # Linux first: `make linux-app` emits the unpacked tree under output/
      # that our packageConveyorAppImage task wraps into a portable AppImage.
      # Conveyor 22.0 dropped native AppImage support, hence the wrap.
      - name: Run Conveyor (linux-app)
        uses: hydraulic-software/conveyor/actions/build@v22.0
        with:
          command: -Kapp.machines=linux.amd64.glibc make linux-app
          agree_to_license: 1
          signing_key: ${{ secrets.CONVEYOR_SIGNING_KEY }}

      - name: Wrap Linux app tree → AppImage
        run: ./gradlew :desktopApp:packageConveyorAppImage --no-configuration-cache

      # `make site` builds every machine that has non-empty targets +
      # `.appinstaller`, `.exe` wrapper, and the download.html landing
      # page. Conveyor wipes output/ at the start, so it does NOT clobber
      # the AppImage we already wrapped (that lives under
      # desktopApp/build/appimage/).
      #
      # `-Kapp.machines=...` restricts the site build to Mac + Windows.
      # Linux is excluded because we already produced the AppImage in
      # the previous step. Without this restriction, `make site` re-
      # enters Conveyor's Linux tarball pipeline as an intermediate even
      # when `linux.amd64.targets = []`, and that intermediate fails the
      # build with "Linux Tarball Contents for Intel" before the Mac /
      # Windows artifacts get a chance to run.
      - name: Run Conveyor (make site, Mac + Windows only)
        uses: hydraulic-software/conveyor/actions/build@v22.0
        with:
          command: '-Kapp.machines=[mac.amd64,mac.aarch64,windows.amd64] make site'
          agree_to_license: 1
          signing_key: ${{ secrets.CONVEYOR_SIGNING_KEY }}

      - name: Stage AppImage into output/ for upload
        run: cp desktopApp/build/appimage/conveyor/SimpMusic-*.AppImage output/

      - name: Show built artifacts
        run: ls -lh output/

      - name: Upload AppImage to run artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-appimage
          path: output/SimpMusic-*.AppImage

      - name: Upload macOS zips to run artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-mac-zips
          path: output/*-mac-*.zip
          if-no-files-found: error

      # Bundle Windows installer = install.bat + simpmusic.crt + msix.
      # Conveyor's default .exe wrapper + .appinstaller fetch URLs from
      # `site.base-url` (GitHub Releases /latest/download/) which 404 for
      # unreleased builds, so we ship our own scripts/windows/install.bat
      # that trusts the cert and sideloads the msix offline — no network
      # round-trip, double-click works, UAC self-elevates.
      #
      # Only x64 is shipped — windows.aarch64 is dropped because
      # androidx.sqlite-bundled lacks a Windows ARM64 native (see
      # conveyor.conf for full context). ARM Windows users get the x64
      # msix running under Prism emulation, which works correctly.
      - name: Bundle Windows offline installer
        run: |
          set -euo pipefail
          if [ ! -f output/simpmusic.crt ]; then
            echo "::error::output/simpmusic.crt missing — Conveyor signing must have failed"
            exit 1
          fi
          msix=$(ls output/simpmusic-*.x64.msix 2>/dev/null | head -1)
          if [ -z "$msix" ]; then
            echo "::error::No simpmusic-*.x64.msix found in output/"
            exit 1
          fi
          mkdir -p installers/
          stage="$(mktemp -d)"
          cp scripts/windows/install.bat "$stage/"
          cp output/simpmusic.crt        "$stage/"
          cp "$msix"                      "$stage/"
          ( cd "$stage" && zip -q -j \
            "${GITHUB_WORKSPACE}/installers/SimpMusic-Windows-installer.zip" \
            install.bat simpmusic.crt "$(basename "$msix")" )
          rm -rf "$stage"
          ls -lh installers/

      - name: Upload Windows offline installer
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          path: installers/SimpMusic-Windows-installer.zip

  wrap-mac-dmg:
    name: Wrap macOS .zip → .dmg (installer UX)
    runs-on: macos-14
    needs: build-desktop-packages
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6

      - name: Install create-dmg + ImageMagick
        # create-dmg = sindresorhus brew formula. ImageMagick is used to
        # downscale the 2800x1600 source background to a sharp 1400x800
        # bitmap using a Lanczos filter (matches the DMG window size).
        run: brew install create-dmg imagemagick

      - name: Read app version
        id: version
        run: |
          VERSION=$(grep '^version-name' gradle/libs.versions.toml | head -1 | cut -d'"' -f2)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "App version: $VERSION"

      - name: Download Mac .zip artifacts
        uses: actions/download-artifact@v4
        with:
          name: desktop-mac-zips
          path: mac-zips

      - name: Prepare background (Lanczos resize 2800x1600 → 1400x800)
        run: |
          mkdir -p build/dmg
          magick composeApp/icon/dmg-background.png \
            -filter Lanczos -resize 1400x800 \
            build/dmg/dmg-bg-1400x800.png

      - name: Wrap each Mac .zip into a polished .dmg
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          shopt -s nullglob
          for zip in mac-zips/simpmusic-*-mac-*.zip; do
            arch="$(basename "$zip" | sed -nE 's/.*-mac-([a-z0-9]+)\.zip/\1/p')"
            [[ -z "$arch" ]] && { echo "Cannot infer arch from $zip" >&2; exit 1; }
            workdir="$(mktemp -d)"
            unzip -q "$zip" -d "$workdir"
            app="$(find "$workdir" -maxdepth 2 -type d -name '*.app' | head -1)"
            [[ -d "$app" ]] || { echo "No .app inside $zip" >&2; exit 1; }
            out="dist/SimpMusic-${VERSION}-mac-${arch}.dmg"
            scripts/wrap-mac-dmg.sh \
              "$app" \
              build/dmg/dmg-bg-1400x800.png \
              composeApp/icon/circle_app_icon.icns \
              "$out"
            rm -rf "$workdir"
          done
          ls -lh dist/

      - name: Upload Mac .dmg artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-mac-dmg
          path: dist/*.dmg

  publish-github-release:
    name: Publish GitHub Release (Production APKs)
    runs-on: ubuntu-latest
    needs: [build-full-release]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release == true)
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Download Full Release APKs
        uses: actions/download-artifact@v4
        with:
          name: app-full-release
          path: release-apks/

      - name: Set up JDK 21 for verification
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: "microsoft"

      - name: Verify APK Signatures before publishing
        run: |
          set -e
          echo "Verifying downloaded release APK signatures..."
          apk_count=0
          for apk in release-apks/Naudio-*.apk; do
            if [ -f "$apk" ]; then
              apk_count=$((apk_count + 1))
              echo "Checking signature metadata in $apk..."
              jar tf "$apk" | grep -E "META-INF/.*\.(RSA|DSA|EC)" || { echo "ERROR: $apk is missing signing signature block!"; exit 1; }
            fi
          done
          if [ "$apk_count" -eq 0 ]; then
            echo "ERROR: No release APKs found to verify in release-apks/!"
            exit 1
          fi

          # Also verify cryptographic integrity with apksigner if available on runner
          if [ -n "$ANDROID_HOME" ] && [ -d "$ANDROID_HOME/build-tools" ]; then
            BUILD_TOOLS_PATH="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
            if [ -f "$BUILD_TOOLS_PATH/apksigner" ]; then
              echo "Running cryptographic verification using apksigner ($BUILD_TOOLS_PATH)..."
              for apk in release-apks/Naudio-*.apk; do
                if [ -f "$apk" ]; then
                  "$BUILD_TOOLS_PATH/apksigner" verify --verbose "$apk"
                fi
              done
            fi
          fi

          echo "All release APK signatures successfully validated."
          ls -lh release-apks/

      - name: Read app version and release tag
        id: version
        run: |
          VERSION=$(grep '^version-name' gradle/libs.versions.toml | head -1 | cut -d'"' -f2)
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="v$VERSION"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Naudio ${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-apks/Naudio-*.apk
